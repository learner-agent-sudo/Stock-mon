name: 13F Net Flow

on:
  workflow_dispatch:
  schedule:
    # Weekly, Saturdays ~11:47 UTC (GitHub often starts it hours late).
    # 13F data is quarterly with a ~45-day lag, so weekly is plenty to catch
    # new filings. Minute :47 rather than :00 — GitHub's docs name the top
    # of the hour as peak load for scheduled runs.
    - cron: "47 11 * * 6"

permissions:
  contents: write
  pages: write
  id-token: write

# Share the Pages concurrency group with the daily briefing so the two
# workflows never deploy on top of each other.
concurrency:
  group: "stock-briefing"
  cancel-in-progress: false

jobs:
  thirteen-f:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests yfinance pandas

      - name: Initialize DB and load seed
        run: |
          python scripts/init_db.py
          python scripts/load_seed.py

      - name: Build 13F page
        env:
          # Identifies us to SEC EDGAR (required) and lifts OpenFIGI limits.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: python scripts/run_13f_to_html.py

      - name: Commit results back to the repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage and commit BEFORE pulling — the build leaves cache files
          # unstaged, and `git pull --rebase` refuses to run with a dirty
          # tree. Commit first so the rebase has a clean working tree, then
          # rebase onto the latest remote and push.
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "13f: $(date -u +%Y-%m-%d)"
          # Retry rebase+push a few times in case another run pushes
          # concurrently to the same branch.
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "push attempt $attempt failed; retrying after backoff..."
            sleep $((attempt * 3))
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # Same artifact-lookup race as in briefing.yml (actions/deploy-pages
      # issue #451): pause, then retry only the deploy step. Only the last
      # attempt can fail the job.
      - name: Let the artifact register
        run: sleep 5

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before final deploy attempt
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (final attempt)
        id: deployment_final
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # Inline content check — fails loudly if the run wrote a 13F page
      # with zero healthy investors (e.g. SEC blocked all fetches).
      - name: Verify output
        run: python scripts/check_health.py --13f

      # External uptime monitoring via healthchecks.io. The check expects
      # a weekly ping; if the run fails we hit /fail so healthchecks.io
      # surfaces it immediately rather than waiting for the timeout.
      - name: Ping healthchecks.io (success)
        if: success()
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_13F_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS -m 10 --retry 3 "${HC_URL%/}" >/dev/null \
              && echo "Pinged healthchecks.io: success" \
              || echo "healthchecks.io ping failed (non-fatal)"
          else
            echo "HEALTHCHECKS_13F_URL secret not set — skipping ping."
          fi

      - name: Ping healthchecks.io (failure)
        if: failure()
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_13F_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS -m 10 --retry 3 "${HC_URL%/}/fail" >/dev/null || true
          fi
