name: Stock Briefing

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is best-effort and frequently delayed 30-90 min
    # (sometimes dropped). Three windows spaced ~3h apart give both
    # reliability (if one is dropped, the next still runs) and genuinely
    # fresher prices at three points across the US trading day:
    #   11:00 UTC ~ pre-open, 14:00 ~ market open, 17:00 ~ early afternoon.
    # Each window builds fresh — the concurrency group below serializes any
    # overlap with a manual run, and the commit step is a no-op when nothing
    # changed, so re-running is cheap and safe.
    - cron: "0 11 * * *"   # ~07:00 EDT / 06:00 EST
    - cron: "0 14 * * *"   # ~10:00 EDT — market open
    - cron: "0 17 * * *"   # ~13:00 EDT — early afternoon

# Allow committing the history archive AND deploying to Pages directly.
permissions:
  contents: write
  pages: write
  id-token: write

# Don't let two runs (e.g. a manual run overlapping the cron) collide.
concurrency:
  group: "stock-briefing"
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    # Cap the run so a slow/hanging data source fails fast instead of
    # burning the 6-hour default. A healthy run finishes in a few minutes.
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet yfinance pandas python-dotenv requests

      - name: Initialize DB and load seed
        run: |
          python scripts/init_db.py
          python scripts/load_seed.py

      - name: Build briefing
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/run_briefing_to_html.py

      - name: Commit history archive back to the repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit BEFORE pulling — `git pull --rebase` refuses to run with a
          # dirty tree, and the build may leave unstaged files.
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "briefing: $(date -u +%Y-%m-%d_%H:%M)"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "push attempt $attempt failed; retrying after backoff..."
            sleep $((attempt * 3))
          done

      # Deploy the docs/ folder to GitHub Pages from within this run.
      # This is what makes the live site update reliably — it does not
      # depend on the bot's commit triggering a separate Pages rebuild
      # (which GITHUB_TOKEN pushes do not do).
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Inline content check — fails the job loudly (and triggers the
      # default GitHub workflow-failure email) if the build "succeeded"
      # but produced degraded content (no news sources, too few prices).
      - name: Verify output
        run: python scripts/check_health.py --briefing

      # External uptime monitoring via healthchecks.io. This only fires on a
      # genuinely successful build (every prior step, incl. Verify output,
      # passed) — so a skipped or degraded build no longer pings green.
      - name: Ping healthchecks.io (success)
        if: success()
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_BRIEFING_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS -m 10 --retry 3 "${HC_URL%/}" >/dev/null \
              && echo "Pinged healthchecks.io: success" \
              || echo "healthchecks.io ping failed (non-fatal)"
          else
            echo "HEALTHCHECKS_BRIEFING_URL secret not set — skipping ping."
          fi

      - name: Ping healthchecks.io (failure)
        if: failure()
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_BRIEFING_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS -m 10 --retry 3 "${HC_URL%/}/fail" >/dev/null || true
          fi
