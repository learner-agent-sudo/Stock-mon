name: Stock Briefing

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is best-effort and frequently delayed 30-90 min
    # (sometimes dropped). Multiple windows + a self-check that exits fast
    # when today's briefing already exists gives self-healing reliability
    # without ever doing duplicate work.
    - cron: "0 11 * * *"   # primary: 07:00 EDT / 06:00 EST
    - cron: "0 14 * * *"   # backstop ~3h later
    - cron: "0 17 * * *"   # backstop ~6h later

# Allow committing the history archive AND deploying to Pages directly.
permissions:
  contents: write
  pages: write
  id-token: write

# Don't let two runs (e.g. a manual run overlapping the cron) collide.
concurrency:
  group: "stock-briefing"
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    # Cap the run so a slow/hanging data source fails fast instead of
    # burning the 6-hour default. A healthy run finishes in a few minutes.
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check briefing freshness
        id: freshness
        run: |
          # Skip only if a briefing was generated in the LAST 2 HOURS — this
          # avoids duplicate work when backstop windows fire close together,
          # but still lets later windows refresh prices during market hours.
          # Manual workflow_dispatch runs always proceed (the user explicitly
          # asked for fresh data).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — always proceed."
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          latest=$(ls -t docs/history/[0-9]*-*.json 2>/dev/null | head -1)
          if [ -z "$latest" ]; then
            echo "No briefing archive found — proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          latest_ts=$(stat -c %Y "$latest")
          age_min=$(( ($(date +%s) - latest_ts) / 60 ))
          if [ "$age_min" -lt 120 ]; then
            echo "Most recent briefing is ${age_min} min old (< 120) — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Most recent briefing is ${age_min} min old — proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.freshness.outputs.skip != 'true'
        run: pip install --quiet yfinance pandas python-dotenv requests

      - name: Initialize DB and load seed
        if: steps.freshness.outputs.skip != 'true'
        run: |
          python scripts/init_db.py
          python scripts/load_seed.py

      - name: Build briefing
        if: steps.freshness.outputs.skip != 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/run_briefing_to_html.py

      - name: Commit history archive back to the repo
        if: steps.freshness.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit BEFORE pulling — `git pull --rebase` refuses to run with a
          # dirty tree, and the build may leave unstaged files.
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "briefing: $(date -u +%Y-%m-%d_%H:%M)"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "push attempt $attempt failed; retrying after backoff..."
            sleep $((attempt * 3))
          done

      # Deploy the docs/ folder to GitHub Pages from within this run.
      # This is what makes the live site update reliably — it does not
      # depend on the bot's commit triggering a separate Pages rebuild
      # (which GITHUB_TOKEN pushes do not do).
      - name: Configure Pages
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/deploy-pages@v4

      # Inline content check — fails the job loudly (and triggers the
      # default GitHub workflow-failure email) if the build "succeeded"
      # but produced degraded content (no news sources, too few prices).
      - name: Verify output
        if: steps.freshness.outputs.skip != 'true'
        run: python scripts/check_health.py --briefing

      # External uptime monitoring via healthchecks.io. The check expects
      # a daily ping; if any of the 3 cron windows succeeds (or skips
      # because today's briefing already exists), we ping. If the job
      # fails, we ping /fail so healthchecks.io surfaces it immediately
      # instead of waiting for the dead-man's-switch timeout.
      - name: Ping healthchecks.io (success or skipped)
        if: success()
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_BRIEFING_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS -m 10 --retry 3 "${HC_URL%/}" >/dev/null \
              && echo "Pinged healthchecks.io: success" \
              || echo "healthchecks.io ping failed (non-fatal)"
          else
            echo "HEALTHCHECKS_BRIEFING_URL secret not set — skipping ping."
          fi

      - name: Ping healthchecks.io (failure)
        if: failure()
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_BRIEFING_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS -m 10 --retry 3 "${HC_URL%/}/fail" >/dev/null || true
          fi
