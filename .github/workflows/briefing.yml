name: Stock Briefing

on:
  workflow_dispatch:
  schedule:
    # 11:00 UTC daily = 07:00 EDT (summer) / 06:00 EST (winter)
    # GitHub cron is UTC-only, so this shifts by 1 hour with DST.
    - cron: "0 11 * * *"

# Allow committing the history archive AND deploying to Pages directly.
permissions:
  contents: write
  pages: write
  id-token: write

# Don't let two runs (e.g. a manual run overlapping the cron) collide.
concurrency:
  group: "stock-briefing"
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --quiet yfinance pandas python-dotenv requests

      - name: Initialize DB and load seed
        run: |
          python scripts/init_db.py
          python scripts/load_seed.py

      - name: Build briefing
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/run_briefing_to_html.py

      - name: Commit history archive back to the repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "briefing: $(date -u +%Y-%m-%d_%H:%M)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Deploy the docs/ folder to GitHub Pages from within this run.
      # This is what makes the live site update reliably — it does not
      # depend on the bot's commit triggering a separate Pages rebuild
      # (which GITHUB_TOKEN pushes do not do).
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
