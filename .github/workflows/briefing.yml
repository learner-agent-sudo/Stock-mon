name: Stock Briefing

on:
  workflow_dispatch:
  schedule:
    # 11:00 UTC daily = 07:00 EDT (summer) / 06:00 EST (winter)
    # GitHub cron is UTC-only, so this shifts by 1 hour with DST.
    - cron: "0 11 * * *"

permissions:
  contents: write   # so the workflow can commit docs/ back to the repo

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --quiet yfinance pandas python-dotenv requests

      - name: Initialize DB and load seed
        run: |
          python scripts/init_db.py
          python scripts/load_seed.py

      - name: Build briefing
        run: python scripts/run_briefing_to_html.py

      - name: Commit and push briefing output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "briefing: $(date -u +%Y-%m-%d_%H:%M)"
            git push
          fi
