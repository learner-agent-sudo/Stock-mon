name: Stock Briefing

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is best-effort: since late Aug 2026 these runs have
    # started 4-9 HOURS late (worst on Mondays), and some are dropped. Three
    # windows spaced ~3h apart mean a dropped one is covered by the next,
    # and the commit step is a no-op when nothing changed, so extra runs are
    # cheap and safe. Minute :47 rather than :00 on purpose — GitHub's docs
    # name the top of the hour as peak load and advise another minute.
    - cron: "47 10 * * *"   # ~06:47 EDT / 05:47 EST — pre-open
    - cron: "47 13 * * *"   # ~09:47 EDT — market open
    - cron: "47 16 * * *"   # ~12:47 EDT — early afternoon

# Allow committing the history archive AND deploying to Pages directly.
permissions:
  contents: write
  pages: write
  id-token: write

# Don't let two runs (e.g. a manual run overlapping the cron) collide.
concurrency:
  group: "stock-briefing"
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    # Cap the run so a slow/hanging data source fails fast instead of
    # burning the 6-hour default. A healthy run finishes in ~5 minutes (slow
    # days ~13); 30 leaves room for up to three 4-minute deploy attempts.
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet yfinance pandas python-dotenv requests

      - name: Initialize DB and load seed
        run: |
          python scripts/init_db.py
          python scripts/load_seed.py

      - name: Build briefing
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/run_briefing_to_html.py

      - name: Commit history archive back to the repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit BEFORE pulling — `git pull --rebase` refuses to run with a
          # dirty tree, and the build may leave unstaged files.
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "briefing: $(date -u +%Y-%m-%d_%H:%M)"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "push attempt $attempt failed; retrying after backoff..."
            sleep $((attempt * 3))
          done

      # Deploy the docs/ folder to GitHub Pages from within this run.
      # This is what makes the live site update reliably — it does not
      # depend on the bot's commit triggering a separate Pages rebuild
      # (which GITHUB_TOKEN pushes do not do).
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # deploy-pages looks the artifact up by name, and GitHub's artifact API
      # sometimes lists nothing for a moment after the upload has finished
      # ("No artifacts named github-pages were found" — actions/deploy-pages
      # issue #451). That failed 4 of 12 runs in a week whose build was fine,
      # and each one pinged healthchecks.io /fail. So: pause, then retry the
      # deploy (only the deploy — uploading again would make a duplicate
      # artifact, which is a different error). Only the last attempt can
      # fail the job.
      - name: Let the artifact register
        run: sleep 5

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 240000   # 4 min per attempt (default 10) so retries fit the job limit

      - name: Wait before retrying deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 240000   # 4 min per attempt (default 10) so retries fit the job limit

      - name: Wait before final deploy attempt
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (final attempt)
        id: deployment_final
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 240000   # 4 min per attempt (default 10) so retries fit the job limit

      # Inline content check — fails the job loudly (and triggers the
      # default GitHub workflow-failure email) if the build "succeeded"
      # but produced degraded content (no news sources, too few prices).
      - name: Verify output
        run: python scripts/check_health.py --briefing

      # External uptime monitoring via healthchecks.io. This only fires on a
      # genuinely successful build (every prior step, incl. Verify output,
      # passed) — so a skipped or degraded build no longer pings green.
      - name: Ping healthchecks.io (success)
        if: success()
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_BRIEFING_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS -m 10 --retry 3 "${HC_URL%/}" >/dev/null \
              && echo "Pinged healthchecks.io: success" \
              || echo "healthchecks.io ping failed (non-fatal)"
          else
            echo "HEALTHCHECKS_BRIEFING_URL secret not set — skipping ping."
          fi

      # cancelled() too: a job that hits timeout-minutes is cancelled, not
      # failed, and would otherwise reach healthchecks.io only by silence.
      - name: Ping healthchecks.io (failure)
        if: failure() || cancelled()
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_BRIEFING_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS -m 10 --retry 3 "${HC_URL%/}/fail" >/dev/null || true
          fi
